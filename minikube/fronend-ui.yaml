apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-ui
  template:
    metadata:
      labels:
        app: shop-ui
    spec:
      containers:
        - name: shop-ui-container
          image: shop-ui:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: shop-ui
spec:
  selector:
    app: shop-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ui-ingress
spec:
  rules:
    - host: simple-shop
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-ui
                port:
                  number: 80